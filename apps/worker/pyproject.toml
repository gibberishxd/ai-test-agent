[project]
name = "worker"
version = "0.1.0"
description = "The AI test agent: crawls a site, finds bugs, writes reports"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.6.0",
    "httpx>=0.28.1",
    "playwright>=1.64.1",
    "psycopg[binary]>=3.3.8",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "sqlalchemy>=2.1.8",
]

[project.scripts]
worker = "worker.main:main"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
