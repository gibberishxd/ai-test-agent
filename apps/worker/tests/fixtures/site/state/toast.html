<!doctype html><meta charset="utf-8"><title>Toast save</title><body><h1>Profile</h1><p id="who">Hello, Demo User</p><form id="f"><label for="name">Display name</label><input id="name" name="name" value="Demo User"><label for="pw">Password</label><input id="pw" type="password" value="hunter2-secret"><button type="submit">Save changes</button></form><p id="msg" role="status"></p><p>Order total: $24.00</p><div id="toast"></div>
<script>document.getElementById('f').addEventListener('submit', e => { e.preventDefault();
  const t = document.getElementById('toast'); t.textContent = 'Profile updated';
  setTimeout(() => { t.textContent = ''; }, 300); });</script></body>
