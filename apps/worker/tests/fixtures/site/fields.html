<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fields</title>
    <link rel="icon" href="data:," />
    <style>
      .group { margin: 24px 0; }
      .far { margin-top: 600px; }
    </style>
  </head>
  <body>
    <h1>Sign in</h1>
    <form>
      <div class="group">
        <label for="email">Email</label>
        <input id="email" type="email" required value="ada@" aria-invalid="true"
               aria-describedby="email-help" />
        <small id="email-help">We never share your email.</small>
        <!-- An error that belongs to the password, shown in the email's group. -->
        <p role="alert">Wrong password.</p>
      </div>
      <div class="group">
        <label for="password">Password</label>
        <input id="password" type="password" aria-errormessage="password-error" />
        <span id="password-error" hidden>Hidden until needed</span>
      </div>
      <div class="group"><input id="city" aria-label="City" /></div>
      <p class="field-error">City is required.</p>
      <button type="submit">Log in</button>
    </form>
    <p class="far" role="status">Your session will expire soon.</p>
  </body>
</html>
